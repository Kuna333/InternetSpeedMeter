name: Build InternetSpeedMeter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir source
          tar -xzf InternetSpeedMeter-v1.0-source.tar.gz -C source
          cp -a source/InternetSpeedMeter/. .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK permissions
        run: |
          $ANDROID_HOME/build-tools/34.0.0/aapt dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt

          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission found!"
            exit 1
          else
            echo "Privacy check passed: No INTERNET permission"
          fi

          cat permissions.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InternetSpeedMeter-v1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
