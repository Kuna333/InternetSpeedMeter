name: Build InternetSpeedMeter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir source
          tar -xzf InternetSpeedMeter-v1.0-source.tar.gz -C source
          cp -a source/InternetSpeedMeter/. .

      - name: Fix Android 13 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          content = gradle.read_text()

          if "minSdk = 34" not in content:
              raise SystemExit("ERROR: Original minSdk setting not found")

          content = content.replace("minSdk = 34", "minSdk = 26")
          gradle.write_text(content)

          service = Path("app/src/main/java/com/minimal/speedmeter/SpeedMeterService.kt")
          content = service.read_text()

          old = "Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q"
          new = "Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE"

          if old not in content:
              raise SystemExit("ERROR: Original service condition not found")

          content = content.replace(old, new)
          service.write_text(content)

          print("Android 13 compatibility changes applied.")
          print("Minimum SDK: 26")
          print("Foreground service specialUse: Android 14+")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Increase Gradle memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties

          echo "Updated Gradle memory settings:"
          grep org.gradle.jvmargs gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK permissions
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"

          $AAPT dump permissions "$APK" | tee permissions.txt

          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission found!"
            exit 1
          else
            echo "Privacy check passed: No INTERNET permission"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InternetSpeedMeter-v1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
